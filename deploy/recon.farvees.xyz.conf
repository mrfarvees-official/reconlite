# /etc/nginx/sites-available/recon.farvees.xyz  (symlink into sites-enabled)
# App: `npm run build && npm start` (listens on 127.0.0.1:3000; use `next start -H 127.0.0.1`).
# Certificate: sudo certbot --nginx -d recon.farvees.xyz   (fills in/maintains the ssl_* lines)

# limit_req_zone is only valid in the http{} context; files in sites-enabled are included there.
limit_req_zone $binary_remote_addr zone=scan:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name recon.farvees.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recon.farvees.xyz;

    ssl_certificate     /etc/letsencrypt/live/recon.farvees.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recon.farvees.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # Coarse edge limit on top of the app's 5 scans / 10 min per IP (zone defined at top of file).
    location = /api/scan {
        limit_req zone=scan burst=3 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE (not append) so clients cannot spoof the IP the app rate-limits on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: stream frames as modules finish.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 4k;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
